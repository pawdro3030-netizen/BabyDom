<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zamówienie | BabyDom</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="checkout.css"><link rel="stylesheet" href="verification.css"><style>.inpost-picker{display:grid;gap:8px;margin:14px 0;padding:12px;border:1px solid #d6e7d9;border-radius:12px}.inpost-picker input{padding:13px;border:1px solid #ddd;border-radius:10px;width:100%}.inpost-pick-button{padding:12px;border:1px solid #91c5a3;border-radius:10px;background:#edf7ee;cursor:pointer;font-weight:700}.inpost-map{border:1px solid #cbdaca;border-radius:10px;min-height:420px}.inpost-map[hidden]{display:none}.inpost-map inpost-geowidget{display:block;width:100%;height:440px}</style></head><body><div class="announcement">Darmowa dostawa od 149 zł <span>•</span> Wysyłka we wtorki i piątki</div><header class="site-header"><a class="brand" href="index.html"><img src="assets/babydom-logo.png" alt="BabyDom"></a><a class="back-link" href="index.html#produkty">← Wróć do zakupów</a></header><main class="checkout-page"><p class="eyebrow">Zamówienie</p><h1>Finalizujemy zakupy</h1><div class="checkout-grid"><form id="order-form"><h2>Dane do dostawy</h2><label>Imię i nazwisko<input required name="name" autocomplete="name"></label><label>E-mail<input required type="email" name="email" autocomplete="email"></label><label>Telefon<input required type="tel" name="phone" autocomplete="tel"></label><label>Ulica i numer<input required name="street" autocomplete="street-address"></label><div class="two"><label>Kod pocztowy<input required name="postcode" autocomplete="postal-code"></label><label>Miejscowość<input required name="city" autocomplete="address-level2"></label></div><h2>Dostawa</h2><p id="delivery-info"></p><div id="locker-label" class="inpost-picker"><label for="lockerCodeStandalone">Paczkomat lub PaczkoPunkt InPost</label><input id="lockerCodeStandalone" name="lockerCode" pattern="[A-Za-z0-9]{3,30}" readonly placeholder="Wybierz punkt na mapie"><button type="button" data-inpost-open class="inpost-pick-button">📍 Wybierz na mapie</button><p data-inpost-info>Wyszukaj ulicę lub wybierz punkt na mapie.</p><div data-inpost-map class="inpost-map" hidden></div></div><p class="terms"><label><input required type="checkbox"> Akceptuję <a href="regulamin.html">regulamin</a> oraz zasady <a href="zwroty.html">zwrotów</a>.</label><label><input required type="checkbox"> Zapoznałem/am się z <a href="polityka-prywatnosci.html">polityką prywatności</a>.</label></p><button class="button button-primary" type="submit">Przejdź do płatności →</button></form><aside class="order-summary"><h2>Twoje zamówienie</h2><div id="order-items"></div><div class="order-total"><span>Razem</span><strong id="order-total"></strong></div></aside></div></main><script src="inpost-picker.js"></script><script src="checkout.js"></script></body></html>
