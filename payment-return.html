<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Płatność | BabyDom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/BabyDom-strona/styles.css">

  <style>
    body {
      margin: 0;
      background: #fffafc;
      color: #2c2630;
      font-family: "DM Sans", sans-serif;
    }

    .payment-header {
      background: #fff;
      border-bottom: 1px solid #f1e7ec;
      padding: 18px 24px;
      text-align: center;
    }

    .payment-header img {
      width: 150px;
      max-width: 45vw;
      height: auto;
      display: inline-block;
    }

    .payment-page {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .payment-card {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border: 1px solid #f0e3e9;
      border-radius: 28px;
      padding: 48px 36px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 18px 60px rgba(80, 45, 65, 0.08);
    }

    .status-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: #f8edf2;
    }

    .payment-card h1 {
      margin: 0 0 14px;
      font-family: "Fraunces", serif;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.1;
    }

    .payment-card p {
      color: #6d6269;
      line-height: 1.65;
      font-size: 16px;
    }

    .order-box {
      display: none;
      margin: 28px 0;
      padding: 18px;
      border-radius: 16px;
      background: #fff7fa;
    }

    .order-box span {
      display: block;
      color: #8a7d84;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .order-box strong {
      font-size: 18px;
    }

    .payment-button {
      display: inline-block;
      margin-top: 15px;
      padding: 15px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      background: #ee8eae;
      color: #fff;
      transition: transform .15s ease;
    }

    .payment-button:hover {
      transform: translateY(-2px);
    }

    .loader {
      width: 36px;
      height: 36px;
      margin: 25px auto 0;
      border: 4px solid #f3dfe7;
      border-top-color: #ee8eae;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .payment-card {
        padding: 38px 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="payment-header">
    <a href="/BabyDom-strona/index.html">
      <img
        src="/BabyDom-strona/assets/babydom-logo.png"
        alt="BabyDom"
      >
    </a>
  </header>

  <main class="payment-page">

    <section class="payment-card">

      <div class="status-icon" id="status-icon">
        ⏳
      </div>

      <h1 id="status-title">
        Potwierdzamy płatność
      </h1>

      <p id="status-text">
        Poczekaj chwilę. Sprawdzamy, czy płatność została
        prawidłowo potwierdzona przez Przelewy24.
      </p>

      <div class="order-box" id="order-box">
        <span>Numer zamówienia</span>
        <strong id="order-number"></strong>
      </div>

      <div class="loader" id="loader"></div>

      <a
        href="/BabyDom-strona/index.html"
        class="payment-button"
        id="return-button"
        style="display:none"
      >
        Wróć do sklepu
      </a>

    </section>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("sessionId");

    const icon = document.querySelector("#status-icon");
    const title = document.querySelector("#status-title");
    const text = document.querySelector("#status-text");
    const loader = document.querySelector("#loader");

    const orderBox = document.querySelector("#order-box");
    const orderNumber = document.querySelector("#order-number");
    const returnButton = document.querySelector("#return-button");

    let attempts = 0;
    const maxAttempts = 15;

    function showError(message) {
      icon.textContent = "!";

      title.textContent =
        "Nie udało się potwierdzić płatności";

      text.textContent =
        message ||
        "Jeśli płatność została wykonana, skontaktuj się z nami przed ponowną próbą zapłaty.";

      loader.style.display = "none";
      returnButton.style.display = "inline-block";
    }

    function showPaid(order) {
      icon.textContent = "✓";

      title.textContent =
        "Dziękujemy za zamówienie!";

      text.textContent =
        "Płatność została potwierdzona. Twoje zamówienie zostało przyjęte do realizacji.";

      if (order.orderNumber) {
        orderNumber.textContent =
          order.orderNumber;

        orderBox.style.display =
          "block";
      }

      loader.style.display = "none";
      returnButton.style.display = "inline-block";

      /*
        Koszyk usuwamy dopiero po potwierdzeniu
        statusu PAID przez nasz serwer.
      */
      localStorage.removeItem("babydom-cart");
      localStorage.removeItem("babydom-last-order");
    }

    async function checkPayment() {
      if (!sessionId) {
        showError(
          "Brakuje identyfikatora zamówienia."
        );
        return;
      }

      attempts++;

      try {
        const response = await fetch(
          "/api/order-status?sessionId=" +
          encodeURIComponent(sessionId),
          {
            cache: "no-store"
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Nie udało się sprawdzić zamówienia."
          );
        }

        if (data.orderNumber) {
          orderNumber.textContent =
            data.orderNumber;

          orderBox.style.display =
            "block";
        }

        if (
          data.paid === true ||
          data.status === "paid"
        ) {
          showPaid(data);
          return;
        }

        /*
          Callback z Przelewy24 może dotrzeć
          chwilę po powrocie klienta.
        */
        if (attempts < maxAttempts) {
          setTimeout(
            checkPayment,
            2000
          );
          return;
        }

        icon.textContent = "⏳";

        title.textContent =
          "Płatność jest przetwarzana";

        text.textContent =
          "Nie otrzymaliśmy jeszcze ostatecznego potwierdzenia płatności. Nie wykonuj ponownej płatności. Status zamówienia może zostać zaktualizowany po chwili.";

        loader.style.display = "none";
        returnButton.style.display = "inline-block";

      } catch (error) {
        console.error(
          "Payment status error:",
          error
        );

        if (attempts < maxAttempts) {
          setTimeout(
            checkPayment,
            2000
          );
          return;
        }

        showError(
          "Nie udało się obecnie sprawdzić statusu zamówienia. Jeśli płatność została pobrana, nie wykonuj jej ponownie."
        );
      }
    }

    checkPayment();
  </script>

</body>
</html>
