<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zamówienia | BabyDom</title><style>body{font:16px Arial;background:#eef7ef;color:#172234;margin:0;padding:24px}main{max-width:1100px;margin:auto}input,button{font:inherit;padding:12px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer;background:#4d8d5c;color:white}article{background:white;border-radius:16px;padding:24px;margin:16px 0}table{width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #eee}#message{margin:16px 0}nav{display:flex;gap:10px;flex-wrap:wrap}h1{font-size:28px}</style><main><h1>BabyDom — zamówienia</h1><form id="login"><input id="secret" type="password" placeholder="Hasło panelu" required autocomplete="current-password"><button>Zaloguj</button></form><nav hidden id="actions"><button id="refresh">Odśwież</button><button id="prev">Poprzednia strona</button><button id="next">Następna strona</button><button id="logout">Wyloguj</button></nav><p id="message" role="status"></p><section id="orders"></section></main><script type="module">
let token='',page=0;
const $=id=>document.getElementById(id), money=n=>(n/100).toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function request(method='GET',body){const r=await fetch('/api/admin-orders'+(method==='GET'?`?page=${page}`:''),{method,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
async function load(){ $('message').textContent='Wczytywanie…';try{const d=await request();$('login').hidden=true;$('actions').hidden=false;$('orders').replaceChildren();$('message').textContent=`Strona ${page+1} · ${d.orders.length} zamówień`; $('prev').disabled=page===0;$('next').disabled=d.orders.length<50;
for(const o of d.orders){const a=element('article','');a.append(element('h2',o.order_number),element('p',`${o.status} · ${money(o.amount)} · ${new Date(o.created_at).toLocaleString('pl-PL')}`),element('p',`${o.customer_name} · ${o.customer_email} · ${o.customer_phone||''}`),element('p',`${o.street}, ${o.postal_code} ${o.city} · ${o.delivery||''} ${o.locker_code||''}`));const table=element('table','');for(const i of (typeof o.items==='string'?JSON.parse(o.items):o.items)){const tr=element('tr','');tr.append(element('td',i.name),element('td',`${i.qty} szt.`),element('td',money(i.lineTotal)));table.append(tr)}a.append(table,element('p',`Wiadomości przyjęte przez Resend: ${o.emails_sent}/2`));if(o.status==='paid'&&o.emails_sent<2){const b=element('button','Ponów brakujące e-maile');b.onclick=async()=>{b.disabled=true;try{await request('POST',{sessionId:o.session_id});await load()}catch(e){$('message').textContent=e.message;b.disabled=false}};a.append(b)}$('orders').append(a)}}catch(e){$('message').textContent=e.message}}
$('login').onsubmit=e=>{e.preventDefault();token=$('secret').value;$('secret').value='';page=0;load()};$('refresh').onclick=load;$('prev').onclick=()=>{if(page>0)page--;load()};$('next').onclick=()=>{page++;load()};$('logout').onclick=()=>{token='';$('orders').replaceChildren();$('actions').hidden=true;$('login').hidden=false;$('message').textContent='Wylogowano'};
</script></html>
